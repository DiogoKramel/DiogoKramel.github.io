<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="400" height="300" fill="#ffffff"/>
  <!-- axes -->
  <g stroke="#9aa5b1" stroke-width="1.2">
    <line x1="50" y1="40" x2="50" y2="250"/>
    <line x1="50" y1="250" x2="370" y2="250"/>
  </g>
  <g stroke="#e6eaee" stroke-width="1">
    <line x1="50" y1="100" x2="370" y2="100"/>
    <line x1="50" y1="175" x2="370" y2="175"/>
  </g>
  <text x="50" y="270" font-size="12" fill="#666" text-anchor="middle">today</text>
  <text x="365" y="270" font-size="12" fill="#666" text-anchor="middle">2050</text>
  <text x="40" y="145" font-size="12" fill="#666" text-anchor="middle" transform="rotate(-90 40 145)">GHG emissions</text>
  <!-- net zero line -->
  <line x1="50" y1="240" x2="370" y2="240" stroke="#2a9d8f" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="368" y="234" font-size="11" fill="#2a9d8f" text-anchor="end">net zero</text>
  <!-- pathways (illustrative) -->
  <g fill="none" stroke-width="2.6" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0">
    <path d="M50 150 C120 140 220 110 365 70" stroke="#c0392b" pathLength="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="2.4s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
    </path>
    <path d="M50 150 C130 150 230 150 365 155" stroke="#e67e22" pathLength="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="2.4s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
    </path>
    <path d="M50 150 C140 160 230 200 365 215" stroke="#3498db" pathLength="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="2.4s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
    </path>
    <path d="M50 150 C110 170 200 235 365 240" stroke="#2a9d8f" pathLength="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="2.4s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
    </path>
  </g>
  <circle cx="50" cy="150" r="4" fill="#222"/>
</svg>
